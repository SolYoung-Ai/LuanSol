<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="LunaSol AI Packaging Studio — 不需要设计经验，告诉 AI 你想做什么，从创意到印刷文件一站完成。" />
    <!-- 图标：全部由 public/logo.png（高分辨率透明底）生成，见 scripts/icons.py。
         多文件名而非同一路径加版本号，是为了绕开浏览器对 favicon 的强缓存。 -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="./favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <title>LunaSol — 人人都能成为设计师</title>
    <!--
      启动兜底层（必须内联，不能是外部文件）
      原因：每次发版都会换 JS 哈希并删除旧文件。若浏览器仍持着缓存里的旧 index.html，
      它会去请求已经 404 的旧 JS，React 永远挂不上，用户看到的就是一片纯白 —— 而且
      没有任何提示。这一层不依赖任何带哈希的资源，所以在这种情况下依然显示得出来，
      并且会自动带 ?v= 重新加载一次去拿新版本。
    -->
    <style>
      #boot, #boot-fail {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #fff; color: #171717;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #boot img { width: 44px; height: 44px; border-radius: 12px; }
      #boot span { font-size: 11px; color: #a0a09a; letter-spacing: .22em; }
      #boot .bar { width: 96px; height: 2px; border-radius: 2px; background: #eee; overflow: hidden; }
      #boot .bar i { display: block; width: 40%; height: 100%; background: #171717; border-radius: 2px; animation: bootSlide 1.1s cubic-bezier(.32,.72,0,1) infinite; }
      @keyframes bootSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      #boot-fail { display: none; padding: 24px; }
      #boot-fail .box {
        max-width: 440px; width: 100%; text-align: center;
        padding: 34px 28px 28px; border-radius: 22px;
        background: rgba(252, 252, 253, .9);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.82), 0 26px 60px -34px rgba(16,18,22,.34);
      }
      #boot-fail img { width: 40px; height: 40px; border-radius: 11px; margin-bottom: 14px; }
      #boot-fail h1 { font-size: 17px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
      #boot-fail p { font-size: 13px; color: #737373; margin: 0 0 6px; line-height: 1.7; }
      #boot-fail small { display: block; font-size: 11.5px; color: #a0a09a; margin-top: 10px; word-break: break-all; }
      #boot-fail button {
        margin-top: 16px; padding: 10px 22px; border: 0; border-radius: 999px;
        background: #171717; color: #fff; font-size: 13px; font-weight: 500; cursor: pointer;
        font-family: inherit;
      }
      @media (prefers-color-scheme: dark) {
        #boot, #boot-fail { background: #0d0d0f; color: #f4f4f5; }
        #boot .bar { background: #26262a; }
        #boot .bar i { background: #f4f4f5; }
        #boot-fail .box { background: rgba(28,28,32,.9); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 26px 60px -34px rgba(0,0,0,.7); }
        #boot-fail p { color: #a1a1aa; }
        #boot-fail button { background: #f4f4f5; color: #171717; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DVjyVyvF.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-k269H4Bi.css">
  </head>
  <body>
    <div id="root"></div>

    <div id="boot">
      <img src="./logo.png" alt="" />
      <div class="bar"><i></i></div>
      <span>LUNA SOL</span>
    </div>

    <div id="boot-fail">
      <div class="box">
        <img src="./logo.png" alt="" />
        <h1 data-zh="页面没能加载出来" data-en="This page failed to load">页面没能加载出来</h1>
        <p data-zh="通常是浏览器缓存了旧版本，而旧版本的脚本已经被新版本替换掉了。" data-en="Usually the browser cached an older version while its scripts have already been replaced.">通常是浏览器缓存了旧版本，而旧版本的脚本已经被新版本替换掉了。</p>
        <p data-zh="点下面按钮重新加载即可，你的草稿和登录状态不会丢。" data-en="Hit the button below to reload — your drafts and sign-in state are safe.">点下面按钮重新加载即可，你的草稿和登录状态不会丢。</p>
        <button type="button" data-zh="重新加载" data-en="Reload" onclick="window.__lunasolReload&&window.__lunasolReload()">重新加载</button>
        <small id="boot-reason"></small>
      </div>
    </div>

    <script>
      (function () {
        var RECOVER_KEY = 'lunasol.boot.recover';
        var booted = false;
        // 启动失败页也要跟界面语言一致：这里还读不到 React，只能直接读 localStorage
        var LANG_KEY = 'lunasol.lang';
        function isEn() { try { return localStorage.getItem(LANG_KEY) === 'en'; } catch (e) { return false; } }
        function applyBootLang() {
          var en = isEn();
          if (en) document.title = 'LunaSol — Everyone can be a designer';
          var els = document.querySelectorAll('#boot-fail [data-zh]');
          for (var i = 0; i < els.length; i++) {
            els[i].textContent = en ? els[i].getAttribute('data-en') : els[i].getAttribute('data-zh');
          }
        }
        applyBootLang();

        function $id(id) { return document.getElementById(id); }

        function showFail(reason) {
          if (booted) return;
          var boot = $id('boot'), fail = $id('boot-fail');
          if (!boot || !fail) return;
          boot.style.display = 'none';
          fail.style.display = 'flex';
          var r = $id('boot-reason');
          if (r) r.textContent = reason ? String(reason).slice(0, 160) : '';
        }

        function reloadWithBust() {
          var u = new URL(location.href);
          u.searchParams.set('v', String(Date.now()));
          location.replace(u.toString());
        }

        // 手动重载：清掉恢复标记，保证这次一定重新请求 HTML
        window.__lunasolReload = function () {
          try { sessionStorage.removeItem(RECOVER_KEY); } catch (e) {}
          reloadWithBust();
        };

        // 自动恢复：20 秒内只尝试一次，避免「失败 → 刷新 → 又失败」的死循环
        window.__lunasolRecover = function (reason) {
          try {
            var last = Number(sessionStorage.getItem(RECOVER_KEY) || 0);
            if (last && Date.now() - last < 20000) {
              showFail((reason || (isEn() ? 'A new version was released' : '新版本已发布')) + (isEn() ? ' (already retried once automatically)' : '（已自动重试过一次）'));
              return;
            }
            sessionStorage.setItem(RECOVER_KEY, String(Date.now()));
          } catch (e) { /* 隐私模式：不写标记，直接重载一次 */ }
          reloadWithBust();
        };

        // 1) 资源级错误：<script> / <link> 404 或加载被拦 → 立即换新版本
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            window.__lunasolRecover(isEn() ? 'A script file failed to load' : '脚本文件加载失败');
            return;
          }
          if (e && e.message && !booted) showFail(e.message);
        }, true);

        // 2) 未捕获的 Promise 拒绝（动态 import 失败常走这里）
        window.addEventListener('unhandledrejection', function (e) {
          if (booted) return;
          var m = e && e.reason && (e.reason.message || String(e.reason));
          showFail(m || (isEn() ? 'Unknown error' : '未知错误'));
        });

        // 3) 看门狗：9 秒还没挂载就给出可点的失败页，而不是留一片白
        setTimeout(function () { if (!booted) showFail('加载超时'); }, 9000);

        // React 挂载成功后由 main.tsx 调用，撤掉兜底层
        window.__lunasolBooted = function () {
          booted = true;
          var boot = $id('boot');
          if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
          // 恢复时加的 ?v= 只用于绕过缓存，进站后清掉，别留在地址栏
          try {
            var u = new URL(location.href);
            if (u.searchParams.has('v')) {
              u.searchParams.delete('v');
              history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
            }
          } catch (e) {}
        };
      })();
    </script>

  </body>
</html>
